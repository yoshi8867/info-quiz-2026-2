<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보건실 &mdash; 용산고 방탈출</title>
<style>
  :root{ --bg:#f4f2ee; --card:#fff; --edge:#ddd8cf; --rule:#ebe6dd;
         --ink:#2b2723; --dim:#8a8078; --hi:#b4553a; --ex:#f0ece3; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#17161a; --card:#232128; --edge:#38343d; --rule:#2c2932;
    --ink:#ece8e3; --dim:#8c8590; --hi:#e08a6b; --ex:#2a2731; } }
  :root[data-theme="dark"]{
    --bg:#17161a; --card:#232128; --edge:#38343d; --rule:#2c2932;
    --ink:#ece8e3; --dim:#8c8590; --hi:#e08a6b; --ex:#2a2731; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:26px;
    padding:44px 16px 70px}
  header{text-align:center;max-width:56ch}
  p{margin:0;font-size:14.5px;line-height:1.8;color:var(--dim)}
  .mono{font-family:"D2Coding","Cascadia Mono","Consolas",monospace}
  .q{color:var(--hi);font-weight:700}
  footer{font-size:13px;color:var(--dim)}

 .title{font-size:26px;font-weight:700;letter-spacing:.34em;margin:0 0 4px}
 .board{background:var(--card);border:1px solid var(--edge);border-radius:12px;
   padding:22px 26px;display:flex;flex-direction:column;gap:6px}
 .line{display:flex;align-items:center;gap:13px}
 .no{width:16px;text-align:right;font-size:11.5px;color:var(--dim);
   font-variant-numeric:tabular-nums}
 .cards{display:flex;gap:6px}
 .ix{width:76px;text-align:center;font-size:11px;color:var(--dim);
   font-family:"D2Coding","Consolas",monospace;padding-bottom:2px}
 .c{width:76px;height:36px;border:1px solid var(--edge);border-radius:5px;
   background:var(--bg);display:flex;align-items:center;justify-content:center;
   font-family:"D2Coding","Consolas",monospace;font-size:12px;font-weight:600;
   letter-spacing:.02em}
 .c.hide{background:transparent;border-style:dashed;opacity:.35}
 .c.done{background:#3f3a33;border-color:#3f3a33;color:#b8ae9e}
 .box{width:34px;height:36px;border-radius:5px;border:1px solid var(--edge);
   background:var(--bg);display:flex;align-items:center;justify-content:center;
   font-family:"D2Coding","Consolas",monospace;font-size:15px;font-weight:700}
 .box.empty{border:none;background:none}
 .box.blank{background:#fde68a;border:2px dashed #f59e0b}
 .lock{display:flex;gap:7px;margin-top:2px}
 .slot{width:38px;height:48px;border-radius:6px;border:2px dashed #f59e0b;
   background:#fde68a}

 .pane{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:6px}
 svg{display:block}
 .e{stroke:var(--ink);stroke-width:1.7;fill:none;opacity:.75}
 .wb{fill:var(--card);opacity:.96}
 .wl{font-size:10px;fill:var(--ink);text-anchor:middle;
   font-family:"D2Coding","Consolas",monospace}
 .n{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
 .n.off{stroke:var(--edge);stroke-dasharray:3 3}
 .nl{font-size:11px;fill:var(--ink);text-anchor:middle;font-weight:600}
 .nl.off{fill:var(--dim);font-weight:400}

 .ys-wrap{width:100%;max-width:780px;display:flex;flex-direction:column;
   align-items:center;gap:26px}
 .ys-place{font-size:12px;letter-spacing:.22em;color:var(--dim)}
 .ys-panel{background:var(--card);border:1px solid var(--edge);border-radius:12px;
   padding:26px 28px;width:100%;max-width:400px;display:flex;
   flex-direction:column;gap:14px}
 .ys-row{display:flex;flex-direction:column;gap:6px}
 .ys-row label{font-size:11.5px;letter-spacing:.1em;color:var(--dim)}
 .ys-row input{font:inherit;font-size:20px;letter-spacing:.18em;text-align:center;
   padding:12px 10px;border-radius:8px;border:1px solid var(--edge);
   background:var(--bg);color:var(--ink);text-transform:uppercase;
   font-family:"D2Coding","Consolas",monospace;width:100%}
 .ys-row input:focus{outline:2px solid var(--hi);outline-offset:1px}
 .ys-row input.plain{text-transform:none;letter-spacing:.08em;font-size:18px}
 .ys-btn{font:inherit;font-size:15px;font-weight:650;padding:13px;border:none;
   border-radius:8px;background:var(--hi);color:#fff;cursor:pointer}
 .ys-btn:active{transform:translateY(1px)}
 .ys-msg{font-size:13px;color:var(--hi);min-height:1.2em;text-align:center}
 .ys-quiet{font-size:12px;color:var(--dim);text-align:center;line-height:1.7}
 .ys-nlab{font-size:11.5px;letter-spacing:.16em;color:var(--dim);text-align:center}
 .ys-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
 .ys-card{background:var(--card);border:1px solid var(--edge);border-radius:10px;
   padding:18px 22px;text-align:center;min-width:168px}
 .ys-nplace{font-size:17px;font-weight:700}
 .ys-nwhere{margin-top:4px;font-size:11.5px;color:var(--dim)}
 .ys-ncode{margin-top:12px;font-size:26px;font-weight:700;letter-spacing:.2em;
   color:var(--hi);font-family:"D2Coding","Consolas",monospace}
 .ys-nlock{margin-top:8px;font-size:11px;color:var(--dim)}
 .ys-note{font-size:12.5px;color:var(--dim);text-align:center;max-width:46ch;
   line-height:1.8}
 .ys-esc{text-align:center}
 .ys-esc-t{font-size:20px;font-weight:700;margin-bottom:14px}
 .ys-esc-t{color:var(--hi)}
 .ys-esc p{margin-top:12px}
 .ys-fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;
   z-index:50}
 .ys-solved{display:flex;flex-direction:column;align-items:center;gap:18px;
   width:100%}
 [hidden]{display:none !important}
</style>
</head>
<body>
<div class="ys-wrap">

  <div class="ys-place">보건실</div>

  <div class="ys-panel" id="gate">
    <div class="ys-row">
      <label>팀코드</label>
      <input id="team" maxlength="8" autocomplete="off">
    </div>
    <div class="ys-row">
      <label>입장코드</label>
      <input id="code" maxlength="10" autocomplete="off">
    </div>
    <button class="ys-btn" id="enter">들어가기</button>
    <div class="ys-msg" id="gmsg"></div>
  </div>

  <div id="puzzle" hidden></div>

  <div class="ys-panel" id="answer" hidden>
    <div class="ys-row">
      <label>정답 &mdash; 숫자 6자</label>
      <input id="ans" class="plain" maxlength="40" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <button class="ys-btn" id="submit">제출</button>
    <div class="ys-msg" id="amsg"></div>
  </div>

  <div class="ys-solved" id="solved" hidden></div>

  <p class="ys-quiet" id="foot"></p>
</div>

<script src="ysbox.js"></script>
